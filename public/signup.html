<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart Admin Signup</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#2D6A4F,#52B788);
}

.signup-container{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:bold;
  color:#2D6A4F;
  margin-bottom:10px;
}

.logo span{
  color:#52B788;
}

h2{
  text-align:center;
  margin-bottom:25px;
  color:#333;
}

.form-group{
  margin-bottom:18px;
}

.form-group input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.signup-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2D6A4F;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.signup-btn:hover{
  background:#1f513a;
}

.login-link{
  text-align:center;
  margin-top:20px;
}

.login-link a{
  color:#2D6A4F;
  text-decoration:none;
  font-weight:bold;
}

.login-link a:hover{
  text-decoration:underline;
}

.footer-text{
  text-align:center;
  margin-top:15px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="signup-container">

  <div class="logo">
    Fresh<span>Mart</span>
  </div>

  <h2>Create Account</h2>

  <div class="form-group">
    <input id="username" type="text" placeholder="Username">
  </div>

  <div class="form-group">
    <input id="password" type="password" placeholder="Password">
  </div>

  <!-- CHANGED BUTTON TEXT -->
  
  <button class="signup-btn" onclick="signup()">
    Sign In
  </button>
   <p>Already have an account?</p>

  <!-- CHANGED TEXT -->
  <div class="login-link">
    <p>Don't have an account?</p>
    <a href="/pages/admin.html">Sign Up</a>
  </div>
  <div class="footer-text">
    manage products and orders.
  </div>

</div>

<script>
async function signup(){
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if(!username || !password){ alert('Please enter username and password'); return; }
  try{
    const res = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if(res.ok){ alert('Account created successfully'); window.location.href = '/pages/admin.html'; }
    else { alert(data.error || 'Signup failed'); }
  } catch(e){ console.error(e); alert('Network error'); }
}
</script>

</body>
</html>
