<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout — FreshMart</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .checkout-page { max-width: 900px; margin: 40px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .checkout-box { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); padding: 28px; }
    .box-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--green); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 13px; font-weight: 600; }
    .form-group input, .form-group select { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color .2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--green); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .order-line { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .order-line.total { font-weight: 700; font-size: 16px; border-bottom: none; margin-top: 8px; color: var(--green); }
    .place-btn { width: 100%; background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font-body); margin-top: 20px; transition: opacity .2s; }
    .place-btn:hover { opacity: .9; }
    .success-box { text-align: center; padding: 40px 20px; }
    .success-box .big { font-size: 64px; margin-bottom: 16px; }
    .success-box h2 { font-family: var(--font-display); font-size: 28px; color: var(--green); margin-bottom: 8px; }
    .order-code { background: var(--green-pale); color: var(--green); font-weight: 700; padding: 10px 20px; border-radius: 8px; display: inline-block; margin: 12px 0; font-size: 16px; }
    .back-btn { background: var(--green); color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font-body); margin-top: 16px; }
    @media(max-width:700px){ .checkout-page{ grid-template-columns:1fr; } }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">Fresh<span>Mart</span></a>
  <div class="nav-links">
    <a href="/">← Back to Shop</a>
  </div>
  <div style="width:100px"></div>
</nav>

<div class="checkout-page" id="checkoutPage">

  <!-- ORDER SUMMARY -->
  <div class="checkout-box">
    <div class="box-title">📦 Order Summary</div>
    <div id="orderSummary"><p style="color:var(--gray)">Loading cart...</p></div>
  </div>

  <!-- CUSTOMER FORM -->
  <div class="checkout-box">
    <div class="box-title">👤 Your Details</div>
    <div class="form-row">
      <div class="form-group"><label>First Name *</label><input type="text" id="fname" placeholder="Amani"/></div>
      <div class="form-group"><label>Last Name *</label><input type="text" id="lname" placeholder="Uwimana"/></div>
    </div>
    <div class="form-group"><label>Phone Number *</label><input type="tel" id="phone" placeholder="+250 7XX XXX XXX"/></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com"/></div>
    <div class="form-group"><label>Delivery Address *</label><input type="text" id="address" placeholder="Street, Sector, District"/></div>
    <div class="form-row">
      <div class="form-group"><label>City</label>
        <select id="city">
          <option>Kigali</option><option>Musanze</option>
          <option>Huye</option><option>Rubavu</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Delivery Date</label>
        <input type="date" id="ddate"/>
      </div>
    </div>
    <div class="form-group"><label>Payment Method</label>
      <select id="payment">
        <option>Mobile Money (MTN MoMo)</option>
        <option>Mobile Money (Airtel Money)</option>
        <option>Cash on Delivery</option>
        <option>Bank Transfer</option>
      </select>
    </div>
    <button class="place-btn" onclick="placeOrder()">🍃 Place Order</button>
  </div>

</div>

<script>
  // Load cart from localStorage
  const cart = JSON.parse(localStorage.getItem('freshmart_cart') || '[]');

  // Set min date to today
  document.getElementById('ddate').min = new Date().toISOString().split('T')[0];

  function renderSummary() {
    const el = document.getElementById('orderSummary');
    if (cart.length === 0) {
      el.innerHTML = '<p style="color:var(--gray)">Your cart is empty. <a href="/">Go shop!</a></p>';
      return;
    }
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    el.innerHTML = cart.map(i => `
      <div class="order-line">
        <span>${i.emoji} ${i.name} × ${i.qty} ${i.unit}</span>
        <span>RWF ${(i.price * i.qty).toLocaleString()}</span>
      </div>
    `).join('') + `
      <div class="order-line total">
        <span>Total</span>
        <span>RWF ${total.toLocaleString()}</span>
      </div>
    `;
  }

  async function placeOrder() {
    const fname = document.getElementById('fname').value.trim();
    const lname = document.getElementById('lname').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const address = document.getElementById('address').value.trim();
    const city = document.getElementById('city').value;
    const ddate = document.getElementById('ddate').value;
    const payment = document.getElementById('payment').value;

    if (!fname || !phone || !address) {
      alert('⚠️ Please fill in First Name, Phone, and Address!');
      return;
    }

    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer: { first_name: fname, last_name: lname, phone, email, address, city },
          items: cart,
          total,
          payment_method: payment,
          delivery_date: ddate
        })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.removeItem('freshmart_cart');
        showSuccess(data.order_code, fname, total, phone);
      } else {
        alert('❌ Order failed: ' + (data.error || 'Unknown error'));
      }
    } catch (e) {
      alert('❌ Could not connect to server. Make sure it is running!');
    }
  }

  function showSuccess(orderCode, fname, total, phone) {
    document.getElementById('checkoutPage').innerHTML = `
      <div class="checkout-box" style="grid-column:1/-1">
        <div class="success-box">
          <div class="big">🎉</div>
          <h2>Order Placed Successfully!</h2>
          <p>Thank you <strong>${fname}</strong>! Your fresh fruits are being prepared.</p>
          <div class="order-code">Order ID: ${orderCode}</div>
          <p style="color:var(--gray);font-size:14px;margin-top:8px">
            Total: <strong>RWF ${total.toLocaleString()}</strong> · Confirmation SMS will be sent to ${phone}
          </p>
          <br/>
          <button class="back-btn" onclick="window.location.href='/'">Continue Shopping 🍎</button>
        </div>
      </div>
    `;
  }

  renderSummary();
</script>
</body>
</html>
